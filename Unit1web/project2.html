<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            width: 320px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
            transition: 0.3s;
        }

        .container:hover {
            transform: scale(1.02);
        }

        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px #667eea;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }

        .card {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #f8f9ff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .card h3 {
            margin: 6px 0;
            color: #444;
        }

        /* Grade colors */
        .grade-A { color: green; font-weight: bold; }
        .grade-B { color: orange; font-weight: bold; }
        .grade-C { color: red; font-weight: bold; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🎓 Student Profile</h2>

    <input type="text" id="name" placeholder="Enter Name">
    <input type="text" id="roll" placeholder="Enter Roll No">
    <input type="number" id="marks" placeholder="Enter Marks">

    <button onclick="showProfile()">Display Profile</button>

    <div class="card" id="profileCard">
        <h3 id="sName"></h3>
        <h3 id="sRoll"></h3>
        <h3 id="sMarks"></h3>
        <h3 id="sGrade"></h3>
    </div>
</div>

<script>
function showProfile() {
    let name = document.getElementById("name").value;
    let roll = document.getElementById("roll").value;
    let marks = document.getElementById("marks").value;

    let grade = "";
    let gradeClass = "";

    if (marks >= 90) {
        grade = "A+";
        gradeClass = "grade-o";
    } else if (marks >= 75) {
        grade = "A";
        gradeClass = "grade-A";
    } else if (marks >= 60) {
        grade = "B";
        gradeClass = "grade-B";
    } else if (marks >= 50) {
        grade = "C";
        gradeClass = "grade-C";
    } else {
        grade = "Fail";
        gradeClass = "grade-C";
    }

    document.getElementById("sName").innerText = "Name: " + name;
    document.getElementById("sRoll").innerText = "Roll No: " + roll;
    document.getElementById("sMarks").innerText = "Marks: " + marks;

    let gradeElement = document.getElementById("sGrade");
    gradeElement.innerText = "Grade: " + grade;
    gradeElement.className = gradeClass;

    document.getElementById("profileCard").style.display = "block";
}
</script>

</body>
</html>
