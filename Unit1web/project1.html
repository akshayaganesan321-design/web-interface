<div class="container">
    <h2>🔥 Smart Counter</h2>
    <h1 id="count">0</h1>

    <button class="increase" onclick="increase()">+1</button>
    <button class="decrease" onclick="decrease()">-1</button><br>

    <button class="plus5" onclick="plusFive()">+5</button>
    <button class="minus5" onclick="minusFive()">-5</button><br>

    <button class="reset" onclick="reset()">Reset</button>
</div>

<script>
    let count = 0;

    function updateDisplay() {
        const display = document.getElementById("count");
        display.textContent = count;

        // Color change based on value
        if (count > 0) display.style.color = "lightgreen";
        else if (count < 0) display.style.color = "red";
        else display.style.color = "white";
    }

    function increase() {
        count++;
        updateDisplay();
    }

    function decrease() {
        if (count > 0) count--; // prevent negative
        updateDisplay();
    }

    function plusFive() {
        count += 5;
        updateDisplay();
    }

    function minusFive() {
        if (count >= 5) count -= 5;
        updateDisplay();
    }

    function reset() {
        count = 0;
        updateDisplay();
    }
</script>
